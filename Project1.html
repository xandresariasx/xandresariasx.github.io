<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Conversation with Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 900px;
            height: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Character Image Section - CENTERED */
        .character-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .character-image-container {
            width: 350px;
            height: 350px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ecf0f1;
            background: #ecf0f1;
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Chat Panel - BELOW THE IMAGE */
        .chat-panel {
            flex: 1;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conversation-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            padding: 20px 30px;
            color: white;
        }

        .conversation-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .conversation-subtitle {
            font-size: 14px;
            opacity: 0.8;
        }

        .conversation-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.03"><rect fill="%23667eea" width="100" height="100"/></svg>');
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            position: relative;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .character-message {
            background: white;
            color: #2c3e50;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        #user-input:focus {
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .voice-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .voice-button:hover {
            transform: scale(1.05);
        }

        .voice-button.listening {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4); }
        }

        .send-button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* Status indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-text {
            font-size: 12px;
            color: #2ecc71;
        }

        .typing-indicator {
            margin-top: 10px;
            color: #3498db;
            font-style: italic;
            display: none;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>	
    <div class="main-container">
        <!-- Character Image Section - CENTERED AT TOP -->
        <div class="character-section">
            <div class="character-image-container">
                <img src="https://img.freepik.com/vector-premium/ilustracion-abogado-su-escritorio_880099-26.jpg" 
                     alt="Professional Assistant" 
                     class="character-image"
                     onerror="this.src='https://images.unsplash.com/photo-1560250097-0b93528c311a?w=400&h=400&fit=crop&crop=face'">
            </div>
        </div>

        <!-- Status Indicator -->        
        <div class="typing-indicator" id="typing-indicator">
            ✍️ Escribiendo respuesta...
        </div>

        <!-- Chat Panel - BELOW THE IMAGE -->
        <div class="chat-panel">
            <div class="conversation-messages" id="conversation-messages">
                <!-- Messages will appear here -->
                <div class="message character-message">
                    ¡Buenos días! Soy la Dra. Elena Rodríguez, su asistente profesional. 
                    ¿En qué puedo ayudarle hoy?
                    <div class="message-time">Ahora mismo</div>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje o usa el micrófono...">
                <button class="voice-button" id="voice-button">🎤</button>
                <button class="send-button" id="send-button">Enviar</button>
            </div>
        </div>
    </div>	
    
    <script src="app.js"></script>
</body>
</html>
